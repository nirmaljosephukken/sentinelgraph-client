# SECURE stage — Security Gate
# Trigger: Pipeline events → Passed (on merge request pipelines) and Mention
# After the scanners (SAST, secrets, dependency, container) have run, the agent
# reads the findings, separates real risk from noise, opens issues for anything
# high/critical, and blocks the MR with a label so a human sees it before merge.
version: v1
environment: ambient
coding_environment: none

components:
  - name: "security_gate"
    type: AgentComponent
    prompt_id: "security_prompt"
    inputs:
      - from: "context:goal"
        as: "event"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "list_security_findings"
      - "get_security_finding_details"
      - "list_vulnerabilities"
      - "get_vulnerability_details"
      - "get_repository_file"
      - "get_merge_request"
      - "create_vulnerability_issue"
      - "create_issue"
      - "update_merge_request"
      - "create_merge_request_note"
      - "gitlab_api_get"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

prompts:
  - prompt_id: "security_prompt"
    name: "Security Gate"
    unit_primitives: []
    prompt_template:
      system: |
        You are the application-security gate for SentinelGraph, a Python agentic fraud investigator for banks. The input is a
        pipeline event payload (or a mention asking for a security check). Steps:

        1. Extract pipeline id, ref, sha and merge request iid (if any). Only act on pipelines where the
           security stage ran (jobs named semgrep-sast, secret_detection, gemnasium-dependency_scanning,
           container_scanning). If none of those ran, final answer "SKIPPED: no scans" and stop.
        2. list_security_findings for the pipeline. For each finding of severity high or critical, call
           get_security_finding_details and read the referenced file with get_repository_file to judge
           whether it is a true positive in THIS codebase (a bank fraud tool: personal data is masked before any LLM call in agent/safety.py, the API is key-gated in agent/access.py, secrets live in Secret Manager, the TigerGraph credential never appears in code — so a finding that claims a hard-coded secret or unmasked PII is HIGH priority; findings about the public demo data under data/, traces/ and cases/ are noise).
        3. Classify every high/critical finding as TRUE POSITIVE, FALSE POSITIVE (say why), or NEEDS REVIEW.
        4. For each TRUE POSITIVE: create_vulnerability_issue (or create_issue if that tool fails) with labels
           `type::security`, `severity::high`, title "[security] <scanner>: <short title>", body with the
           file/line, the risk, and a concrete remediation.
        5. If there is a merge request:
           - any TRUE POSITIVE → update_merge_request to add label `security::blocked`
           - otherwise → add label `security::clear`
           Then create_merge_request_note with a compact table: scanner | findings | high+ | verdict.
        6. Final answer: "SECURITY: clear" or "SECURITY: blocked — N true positives (issues #…)". Stop.

        Be skeptical of generic rules that don't apply (e.g. "no rate limiting" on a demo API is
        NEEDS REVIEW, not a blocker). Never dismiss findings yourself; only humans dismiss.
      user: |
        Project ID: {{ project_id }}
        {{ event }}
      placeholder: history
    params:
      timeout: 600

routers:
  - from: "security_gate"
    to: "end"

flow:
  entry_point: "security_gate"

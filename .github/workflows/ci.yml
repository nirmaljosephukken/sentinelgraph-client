# SentinelGraph client edition: checks on every push and pull request.
#   lint + fast tests    every push and pull request (about 3 minutes, mostly installing)
#   slow tests           pushes to main, nightly, and on demand: the 20 benchmark alerts and the console pages
#   container            pushes to main and nightly: the Docker image builds and all three services start
# Everything runs offline: local graph, no language model, no Google Cloud credentials, no secrets needed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * *"        # nightly, 02:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: none
      GRAPH_BACKEND: local
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: No secrets in the repository
        run: |
          test ! -f .env || { echo "::error::.env must never be committed"; exit 1; }
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}|sk-ant-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|sgk_[0-9a-f]{8}_[A-Za-z0-9_-]{20,}' -- . ':!tests/*'; then
            echo "::error::something that looks like a key or private key is committed"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Policy file is valid
        run: python -c "from agent.policy_config import POLICY; print(POLICY.label, POLICY.mode, POLICY.fingerprint)"

      - name: Fast tests
        run: pytest -m "not slow" -q

      - name: Slow tests (benchmark decisions, answer checker, console pages)
        if: github.event_name != 'pull_request'
        run: pytest -m slow -q

  container:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t sentinelgraph:ci .

      - name: Start the console, worker and API
        run: |
          common="-e LLM_PROVIDER=none -e GRAPH_BACKEND=local -e LIVE_BACKEND=local -e AUTH_MODE=dev -e ALLOW_DEV_AUTH=1"
          docker run -d --name console $common -p 8081:8080 sentinelgraph:ci
          docker run -d --name worker  $common -p 8082:8080 sentinelgraph:ci uvicorn worker.app:app --host 0.0.0.0 --port 8080
          docker run -d --name api     $common -p 8083:8080 sentinelgraph:ci uvicorn api.app:app --host 0.0.0.0 --port 8080

      - name: Health checks
        run: |
          check() { for i in $(seq 1 60); do curl -fsS "$1" >/dev/null && { echo "ok $1"; return 0; }; sleep 3; done; echo "::error::$1 not healthy"; return 1; }
          check http://localhost:8081/_stcore/health
          check http://localhost:8082/healthz
          check http://localhost:8083/v1/health

      - name: Logs on failure
        if: failure()
        run: for c in console worker api; do echo "== $c"; docker logs --tail 80 $c; done
